<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumora – Bildeditor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#0a84ff;--pink:#ff375f;--green:#30d158;
  --bg:#e8ebf2;--text:#1d1d1f;--text2:rgba(29,29,31,.64);--text3:rgba(29,29,31,.42);
  --glass:rgba(255,255,255,.6);--glass-strong:rgba(250,250,252,.88);--stroke:rgba(0,0,0,.08);--stroke2:rgba(0,0,0,.15);
  --fill:rgba(0,0,0,.05);--fill2:rgba(0,0,0,.09);--hover:rgba(0,0,0,.055);--track:rgba(0,0,0,.12);--track2:rgba(0,0,0,.16);
  --seg-on:#fff;--sel:rgba(10,132,255,.13);--sel-b:rgba(10,132,255,.35);
  --shadow:0 12px 40px rgba(30,40,70,.14),0 2px 8px rgba(30,40,70,.07);--hi:inset 0 1px 0 rgba(255,255,255,.75);
  --blob1:#9db4ff;--blob2:#ffb0c6;--blob3:#9cefdc;--aurora-o:.75;
  --backdrop:rgba(20,24,40,.18);--toast-bg:rgba(30,30,34,.9);--toast-fg:#fff;
  --checker:repeating-conic-gradient(#d5d8df 0 25%,#fff 0 50%) 0 0/10px 10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121216;--text:#f5f5f7;--text2:rgba(245,245,247,.62);--text3:rgba(245,245,247,.38);
  --glass:rgba(40,40,46,.55);--glass-strong:rgba(42,42,48,.9);--stroke:rgba(255,255,255,.09);--stroke2:rgba(255,255,255,.17);
  --fill:rgba(255,255,255,.065);--fill2:rgba(255,255,255,.11);--hover:rgba(255,255,255,.075);--track:rgba(255,255,255,.16);--track2:rgba(255,255,255,.2);
  --seg-on:rgba(120,120,130,.55);--sel:rgba(10,132,255,.22);--sel-b:rgba(10,132,255,.5);
  --shadow:0 18px 50px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.3);--hi:inset 0 1px 0 rgba(255,255,255,.08);
  --blob1:#2f35c9;--blob2:#b0245a;--blob3:#0c7f86;--aurora-o:.55;
  --backdrop:rgba(0,0,0,.35);--toast-bg:rgba(245,245,247,.92);--toast-fg:#1d1d1f;
  --checker:repeating-conic-gradient(#3b3b41 0 25%,#2c2c31 0 50%) 0 0/10px 10px;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121216;--text:#f5f5f7;--text2:rgba(245,245,247,.62);--text3:rgba(245,245,247,.38);
  --glass:rgba(40,40,46,.55);--glass-strong:rgba(42,42,48,.9);--stroke:rgba(255,255,255,.09);--stroke2:rgba(255,255,255,.17);
  --fill:rgba(255,255,255,.065);--fill2:rgba(255,255,255,.11);--hover:rgba(255,255,255,.075);--track:rgba(255,255,255,.16);--track2:rgba(255,255,255,.2);
  --seg-on:rgba(120,120,130,.55);--sel:rgba(10,132,255,.22);--sel-b:rgba(10,132,255,.5);
  --shadow:0 18px 50px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.3);--hi:inset 0 1px 0 rgba(255,255,255,.08);
  --blob1:#2f35c9;--blob2:#b0245a;--blob3:#0c7f86;--aurora-o:.55;
  --backdrop:rgba(0,0,0,.35);--toast-bg:rgba(245,245,247,.92);--toast-fg:#1d1d1f;
  --checker:repeating-conic-gradient(#3b3b41 0 25%,#2c2c31 0 50%) 0 0/10px 10px;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{position:relative;height:100%;overflow:hidden;isolation:isolate}
#aurora{position:absolute;inset:-25%;z-index:-1;filter:blur(90px) saturate(1.25);opacity:var(--aurora-o);pointer-events:none}
#aurora i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;animation:drift 40s ease-in-out infinite alternate}
#aurora i:nth-child(1){background:var(--blob1);left:8%;top:2%}
#aurora i:nth-child(2){background:var(--blob2);right:2%;top:24%;animation-duration:48s;animation-delay:-14s}
#aurora i:nth-child(3){background:var(--blob3);left:32%;bottom:-2%;animation-duration:56s;animation-delay:-26s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,-7vh) scale(1.14)}100%{transform:translate(-7vw,8vh) scale(.9)}}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--stroke);box-shadow:var(--shadow),var(--hi)}

/* Top bar */
#topbar{position:absolute;top:10px;left:10px;right:10px;height:50px;border-radius:16px;display:flex;align-items:center;gap:2px;padding:0 8px 0 12px;z-index:30;animation:slideDown .7s cubic-bezier(.2,1,.3,1) both}
@keyframes slideDown{from{transform:translateY(-24px);opacity:0}}
.brand{display:flex;align-items:center;gap:9px;margin-right:8px;font-weight:680;font-size:15px;letter-spacing:-.015em;white-space:nowrap}
.brand svg{width:26px;height:26px}
.menus{display:flex;gap:1px}
.mbtn{height:30px;padding:0 10px;border-radius:8px;font-weight:500;opacity:.9;transition:background .15s}
.mbtn:hover,.mbtn.open{background:var(--hover);opacity:1}
.doc-title{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;min-width:0}
.doc-title input{background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 8px;text-align:center;font-weight:620;width:190px;min-width:60px;outline:0;transition:.15s}
.doc-title input:hover{border-color:var(--stroke2)}
.doc-title input:focus{background:var(--fill);border-color:var(--accent)}
.badge{font-size:11.5px;color:var(--text2);background:var(--fill);padding:3px 9px;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.saved{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text3);opacity:0;transition:opacity .5s}
.saved.show{opacity:1}
.tb-right{display:flex;align-items:center;gap:2px}
.tsep{width:1px;height:20px;background:var(--stroke2);margin:0 6px}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;transition:background .15s,transform .15s,opacity .2s;flex:none}
.ibtn:hover{background:var(--hover)}
.ibtn:active{transform:scale(.9)}
.ibtn:disabled{opacity:.3;pointer-events:none}
.ibtn.act{background:var(--sel);color:var(--accent)}
.btn{height:32px;padding:0 13px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--fill2);transition:filter .15s,transform .15s,background .15s;white-space:nowrap;flex:none}
.btn:hover{background:var(--hover);filter:brightness(1.06)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:linear-gradient(180deg,#2a94ff,#0a72ec);color:#fff;box-shadow:0 4px 14px rgba(10,132,255,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.small{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.danger{color:#ff453a}
.btn.full{width:100%}
.kbd{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.only-narrow{display:none}

/* Dock */
#dock{position:absolute;left:10px;top:120px;width:58px;border-radius:18px;padding:7px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:25;max-height:calc(100% - 196px);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;animation:slideRight .7s .05s cubic-bezier(.2,1,.3,1) both}
#dock::-webkit-scrollbar{display:none}
@keyframes slideRight{from{transform:translateX(-24px);opacity:0}}
.tool{position:relative;z-index:1;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;transition:color .25s,transform .15s;flex:none}
.tool:hover{background:var(--hover)}
.tool.on{color:#fff}
.tool.on:hover{background:transparent}
.tool:active{transform:scale(.88)}
#toolPill{position:absolute;left:7px;top:0;width:42px;height:42px;border-radius:12px;background:linear-gradient(180deg,#2a94ff,#0a72ec);box-shadow:0 6px 16px rgba(10,132,255,.4);transition:transform .45s cubic-bezier(.3,1.35,.45,1);z-index:0;pointer-events:none}
.dock-sep{width:26px;height:1px;background:var(--stroke2);margin:4px 0;flex:none}
.wells{position:relative;width:44px;height:48px;margin-top:6px;flex:none}
.well{position:absolute;width:28px;height:28px;border-radius:9px;border:2.5px solid var(--glass-strong);box-shadow:0 2px 8px rgba(0,0,0,.28);background:var(--checker);overflow:hidden;transition:transform .2s}
.well:hover{transform:scale(1.08)}
.well i{position:absolute;inset:0}
.well.fg{left:0;top:0;z-index:2}
.well.bg{left:14px;top:18px}
.wmini{position:absolute;width:16px;height:16px;display:grid;place-items:center;border-radius:5px;color:var(--text2)}
.wmini:hover{color:var(--text);background:var(--hover)}
.wmini.swap{right:-2px;top:-2px}
.wmini.reset{left:-3px;bottom:-3px}

/* Options bar */
#optbar{position:absolute;top:70px;left:10px;right:336px;height:42px;border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 12px;z-index:24;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;animation:slideDown .7s .08s cubic-bezier(.2,1,.3,1) both;transition:right .45s cubic-bezier(.2,.9,.25,1)}
#optbar::-webkit-scrollbar{display:none}
#optbar.dim{opacity:.5;pointer-events:none}
.opt-title{display:flex;align-items:center;gap:8px;font-weight:650;white-space:nowrap;padding-right:12px;border-right:1px solid var(--stroke2);height:22px;flex:none}
.opt{display:flex;align-items:center;gap:8px;color:var(--text2);white-space:nowrap;font-size:12px;flex:none}
.opt .slider{width:96px}
.opt .num{width:52px}
.osep{width:1px;height:22px;background:var(--stroke2);flex:none}
.hint{color:var(--text3);font-size:12px;white-space:nowrap}
.spacer{flex:1}
.chips{display:flex;gap:5px;flex:none}
.chip{height:28px;padding:0 11px;border-radius:99px;background:var(--fill);font-size:12px;font-weight:550;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--stroke);transition:background .15s,transform .15s;white-space:nowrap}
.chip:hover{background:var(--fill2)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.gchip{width:30px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--stroke2);background-color:transparent;position:relative;overflow:hidden;flex:none;transition:transform .15s}
.gchip:hover{transform:scale(1.08)}
.gchip.on{box-shadow:0 0 0 2px var(--accent)}
.gchip i{position:absolute;inset:0}

/* Inspector */
#inspector{position:absolute;top:70px;right:10px;bottom:10px;width:316px;border-radius:20px;display:flex;flex-direction:column;z-index:26;overflow:hidden;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .3s;animation:slideLeft .7s .1s cubic-bezier(.2,1,.3,1) both}
@keyframes slideLeft{from{transform:translateX(30px);opacity:0}}
#inspector.hidden{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
.tabs{padding:8px 8px 4px}
.seg{position:relative;display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:1px;flex:none}
.seg button{flex:1;height:28px;border-radius:8px;font-size:12px;font-weight:560;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:5px;position:relative;z-index:1;transition:color .2s;white-space:nowrap;padding:0 8px;min-width:30px}
.seg button:hover{color:var(--text)}
.seg button.on{color:var(--text)}
.seg .pill{position:absolute;top:2px;bottom:2px;left:2px;width:0;border-radius:8px;background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 .5px var(--stroke)}
.seg.ready .pill{transition:left .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}
.seg.sm button{height:24px;font-size:11.5px;padding:0 7px}
.pane{flex:1;overflow-y:auto;padding:2px 14px 14px;scrollbar-width:thin;min-height:80px}
.sec{border-top:1px solid var(--stroke);padding:12px 0 8px}
.sec:first-child{border-top:0}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:650;font-size:12.5px;margin-bottom:8px;min-height:22px}
.sec-h .ic{color:var(--text2)}
.sec-h .sp{flex:1}
.sec.off .sec-b{display:none}
.sec.off .sec-h{margin-bottom:0}
.sec-b{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}}
.ctl{display:grid;grid-template-columns:84px 1fr 56px;align-items:center;gap:8px;min-height:30px}
.ctl.col{grid-template-columns:84px 1fr}
.ctl>label{color:var(--text2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl>label.scr{cursor:ew-resize}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.field{display:flex;align-items:center;height:30px;background:var(--fill);border-radius:8px;padding:0 8px;gap:6px;border:1px solid transparent;transition:.15s}
.field:focus-within{border-color:var(--accent);background:var(--glass-strong)}
.field b{font-weight:600;color:var(--text3);font-size:11px;cursor:ew-resize;min-width:12px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-variant-numeric:tabular-nums;text-align:right}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;--p:50%;min-width:40px}
.slider::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p),var(--track) var(--p))}
.slider::-moz-range-track{height:4px;border-radius:4px;background:var(--track)}
.slider::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.12);transition:transform .15s}
.slider:active::-webkit-slider-thumb{transform:scale(1.18)}
.slider::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.num{width:100%;height:26px;background:var(--fill);border:1px solid transparent;border-radius:7px;text-align:right;padding:0 7px;font-variant-numeric:tabular-nums;font-size:12px;outline:0;transition:.15s}
.num:focus{border-color:var(--accent);background:var(--glass-strong)}
.switch{position:relative;width:36px;height:21px;border-radius:21px;background:var(--track2);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(15px)}
.swatch{width:32px;height:26px;border-radius:7px;position:relative;overflow:hidden;background:var(--checker);box-shadow:inset 0 0 0 1px var(--stroke2);flex:none;transition:transform .15s}
.swatch:hover{transform:scale(1.06)}
.swatch i{position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.cfield{display:flex;gap:6px;align-items:center}
.cfield .num{text-align:left;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11.5px}
.sel{height:30px;border-radius:8px;background:var(--fill) url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23888' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 9px center;border:1px solid transparent;padding:0 26px 0 9px;-webkit-appearance:none;appearance:none;outline:0;width:100%;cursor:pointer;font-size:12.5px}
.sel:focus{border-color:var(--accent)}
.sel option{background:var(--glass-strong);color:var(--text)}
.ta{width:100%;min-height:74px;resize:vertical;background:var(--fill);border:1px solid transparent;border-radius:10px;padding:9px 10px;outline:0;font-size:13.5px;line-height:1.4;user-select:text;-webkit-user-select:text;transition:border-color .2s,box-shadow .3s}
.ta:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,.18);background:var(--glass-strong)}
.tbtn{width:32px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--fill);transition:.15s;flex:none}
.tbtn:hover{background:var(--fill2)}
.tbtn.on{background:var(--accent);color:#fff}
.tbtn:active{transform:scale(.92)}
.fontbtn{flex:1;height:34px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:15px;min-width:0;border:1px solid transparent}
.fontbtn:hover{border-color:var(--stroke2)}
.fontbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shapegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:8px}
.shapegrid button{height:36px;border-radius:9px;background:var(--fill);display:grid;place-items:center;transition:.15s}
.shapegrid button:hover{background:var(--fill2)}
.shapegrid button.on{background:var(--accent);color:#fff}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.abtn{min-height:58px;border-radius:12px;background:var(--fill);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;padding:9px 11px;text-align:left;font-weight:560;font-size:12px;transition:background .15s,transform .15s;border:1px solid transparent}
.abtn:hover{background:var(--fill2);border-color:var(--stroke)}
.abtn:active{transform:scale(.97)}
.abtn .ic{color:var(--accent)}
.info{color:var(--text2);font-size:12px;line-height:1.5}
.info b{color:var(--text);font-weight:600}
.empty{text-align:center;color:var(--text2);padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{color:var(--text3)}
.empty b{color:var(--text);font-size:13.5px}
.looks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:6px}
.look{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--text2)}
.look .lt{width:100%;aspect-ratio:1;border-radius:10px;background:var(--checker);overflow:hidden;box-shadow:inset 0 0 0 1px var(--stroke);transition:transform .2s,box-shadow .2s;display:grid;place-items:center}
.look .lt img{width:100%;height:100%;object-fit:cover;display:block}
.look:hover .lt{transform:scale(1.05)}
.look.on .lt{box-shadow:0 0 0 2px var(--accent)}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stylechip{height:48px;border-radius:11px;background:var(--fill);display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.02em;transition:transform .15s,background .15s;border:1px solid var(--stroke)}
.stylechip:hover{transform:translateY(-2px);background:var(--fill2)}
.hist{display:flex;align-items:center;gap:9px;height:34px;padding:0 9px;border-radius:9px;cursor:pointer;transition:background .15s;width:100%;text-align:left}
.hist:hover{background:var(--hover)}
.hist.on{background:var(--sel);box-shadow:inset 0 0 0 1px var(--sel-b)}
.hist.fut{opacity:.4}
.hist .ic{color:var(--text2)}
.hist small{margin-left:auto;color:var(--text3);font-variant-numeric:tabular-nums}

/* Ebenenstil-Dialog */
.backdrop.clear{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;display:block}
.sdlg{position:fixed;width:min(900px,calc(100vw - 24px));height:min(620px,calc(100vh - 40px));display:flex;flex-direction:column;border-radius:22px;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke);box-shadow:0 30px 90px rgba(0,0,0,.45),var(--hi);animation:pop .45s cubic-bezier(.2,1.25,.3,1);overflow:hidden}
.sd-head{display:flex;align-items:center;gap:9px;height:48px;padding:0 10px 0 16px;border-bottom:1px solid var(--stroke);cursor:move;flex:none;touch-action:none}
.sd-head b{font-size:14px}
.sd-name{color:var(--text3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.sd-body{flex:1;display:grid;grid-template-columns:232px 1fr 210px;min-height:0}
.sd-nav{border-right:1px solid var(--stroke);overflow-y:auto;padding:8px}
.sd-item{display:flex;align-items:center;gap:9px;min-height:34px;padding:0 9px;border-radius:9px;width:100%;text-align:left;font-size:12.5px;transition:background .15s}
.sd-item:hover{background:var(--hover)}
.sd-item.on{background:var(--accent);color:#fff}
.sd-item .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--stroke2);display:grid;place-items:center;flex:none;background:var(--glass);transition:background .15s}
.sd-item .ck.on{background:var(--green);border-color:transparent;color:#fff}
.sd-item.on .ck{border-color:rgba(255,255,255,.7)}
.sd-sep{height:1px;background:var(--stroke);margin:6px 4px}
.sd-pane{overflow-y:auto;padding:16px 18px;min-width:0}
.sd-pane h3{font-size:16px;font-weight:720;letter-spacing:-.015em;margin-bottom:3px}
.sd-pane .sub{color:var(--text2);font-size:12px;margin-bottom:14px;line-height:1.45}
.sd-pane .ctl{grid-template-columns:96px 1fr 60px}
.sd-pane .ctl.col{grid-template-columns:96px 1fr}
.sd-side{border-left:1px solid var(--stroke);padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.sd-prev{aspect-ratio:1;border-radius:14px;background:var(--checker);box-shadow:inset 0 0 0 1px var(--stroke);display:grid;place-items:center;overflow:hidden;flex:none}
.sd-prev canvas{width:100%;height:100%;display:block}
.presetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pchip{border-radius:12px;background:var(--checker);padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--text);border:1px solid var(--stroke);transition:transform .2s cubic-bezier(.2,1.3,.4,1),box-shadow .2s;position:relative;overflow:hidden}
.pchip span{background:var(--glass-strong);border-radius:6px;padding:1px 7px}
.pchip canvas{width:100%;aspect-ratio:152/112;height:auto;display:block}
.pchip:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.dial{width:38px;height:38px;border-radius:50%;background:var(--fill2);position:relative;cursor:pointer;box-shadow:inset 0 0 0 1px var(--stroke2);justify-self:start;touch-action:none}
.dial i{position:absolute;left:50%;top:50%;width:16px;height:2px;margin-top:-1px;background:var(--accent);transform-origin:0 50%;border-radius:2px}
.dial i::after{content:"";position:absolute;right:-3px;top:-2px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.patgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 10px}
.patgrid button{aspect-ratio:1;border-radius:8px;box-shadow:inset 0 0 0 1px var(--stroke2);background-color:#fff;transition:transform .15s}
.patgrid button:hover{transform:scale(1.08)}
.patgrid button.on{box-shadow:0 0 0 2px var(--accent)}
.fxrow{display:flex;align-items:center;gap:8px;min-height:36px}
.fxrow .fxi{color:var(--text2)}
.fxrow .fxn{flex:1;text-align:left;font-size:12.5px;padding:6px 4px;border-radius:7px}
.fxrow .fxn:hover{color:var(--accent)}
.fxb{cursor:pointer}
@media (max-width:760px){.sd-body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}.sd-nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--stroke);gap:4px}.sd-item{flex:none;width:auto}.sd-sep{display:none}.sd-side{border-left:0;border-top:1px solid var(--stroke);flex-direction:row;align-items:center;flex-wrap:wrap}.sd-prev{width:72px}.sd-side .info{display:none}.sd-side .btn{width:auto;flex:1}}

/* Tabs, Ordner, Farben */
.doc-title{gap:4px}
.doctabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto;padding:2px}
.doctabs::-webkit-scrollbar{display:none}
.doctab{display:flex;align-items:center;gap:8px;height:36px;padding:0 5px 0 6px;border-radius:11px;max-width:230px;min-width:120px;border:1px solid transparent;transition:background .2s,border-color .2s,box-shadow .2s;cursor:pointer;flex:none;animation:tabIn .4s cubic-bezier(.2,1.25,.3,1)}
@keyframes tabIn{from{opacity:0;transform:translateY(-6px) scale(.94)}}
.doctab:hover{background:var(--hover)}
.doctab.on{background:var(--glass-strong);border-color:var(--stroke);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.doctab .tth{width:32px;height:24px;border-radius:6px;overflow:hidden;background:var(--checker);box-shadow:inset 0 0 0 1px var(--stroke);flex:none;display:grid;place-items:center}
.doctab .tth canvas{width:32px;height:24px;display:block}
.doctab .tcol{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.15}
.doctab .tn{font-weight:620;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doctab small{font-size:10.5px;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}
.doctab input{width:120px;height:22px;border-radius:6px;border:1px solid var(--accent);background:var(--glass-strong);padding:0 6px;outline:0;font-size:12.5px;font-weight:600}
.doctab .tx{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--text3);opacity:0;transition:opacity .15s,background .15s;flex:none}
.doctab:hover .tx,.doctab.on .tx{opacity:1}
.doctab .tx:hover{background:var(--fill2);color:var(--text)}
.layer{position:relative}
.layer.lab::before{content:"";position:absolute;left:2px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--lc)}
.layer.lab .mini.eye{background:color-mix(in srgb,var(--lc) 28%,transparent);color:var(--text)}
.layer.drop-in{background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent)}
.layer .th.fold{background:none;box-shadow:none;display:flex;align-items:center;justify-content:flex-start;gap:0;color:var(--text2);overflow:visible}
.layer.grp .nm b{font-weight:650}
.chev{width:16px;height:22px;display:grid;place-items:center;color:var(--text3);border-radius:5px;transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.chev.open{transform:rotate(90deg)}
.chev:hover{color:var(--text)}
.lcols{display:flex;gap:6px;flex-wrap:wrap}
.lcol{width:22px;height:22px;border-radius:50%;background:var(--lc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);transition:transform .15s;position:relative}
.lcol:hover{transform:scale(1.15)}
.lcol.on{box-shadow:0 0 0 2px var(--glass-strong),0 0 0 4px var(--accent)}
.lcol.none{background:var(--fill2)}
.lcol.none::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:1.5px;background:var(--text3);transform:rotate(-45deg)}
.mswatch{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.mswatch.none{box-shadow:inset 0 0 0 1.5px var(--text3)}

.psdnote{display:flex;gap:7px;align-items:flex-start;background:var(--sel);border-radius:9px;padding:8px 10px;margin-bottom:8px;color:var(--text)}
.psdnote .ic{color:var(--accent);margin-top:1px}

.layer.pk{background:rgba(10,132,255,.09);box-shadow:inset 0 0 0 1px rgba(10,132,255,.25)}
.pkchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pkchips .chip{height:24px;font-size:11.5px;max-width:140px;overflow:hidden;text-overflow:ellipsis}

/* Gradient editor */
.ge{margin-top:4px}
.ge-bar{position:relative;height:28px;border-radius:9px;background:var(--checker);box-shadow:inset 0 0 0 1px var(--stroke2);cursor:copy;margin:8px 0 22px;touch-action:none}
.ge-bar>i{position:absolute;inset:0;border-radius:9px;pointer-events:none}
.ge-stop{position:absolute;top:100%;width:17px;height:17px;margin-left:-8.5px;margin-top:4px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);cursor:grab;touch-action:none;transition:transform .15s}
.ge-stop::before{content:"";position:absolute;left:50%;top:-8px;width:2px;height:6px;background:#fff;transform:translateX(-50%);box-shadow:0 0 2px rgba(0,0,0,.4)}
.ge-stop.on{transform:scale(1.2);box-shadow:0 0 0 2px var(--accent),0 1px 5px rgba(0,0,0,.45)}
.ge-presets{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.ge-presets button{height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s;background-color:transparent}
.ge-presets button:hover{transform:scale(1.12)}

/* Layers */
#layers{border-top:1px solid var(--stroke);display:flex;flex-direction:column;height:var(--layers-h,300px);min-height:150px;max-height:75%;flex:none}
.splitter{height:10px;cursor:ns-resize;display:grid;place-items:center;flex:none;touch-action:none}
.splitter::before{content:"";width:38px;height:4px;border-radius:4px;background:var(--stroke2);transition:background .2s}
.splitter:hover::before{background:var(--accent)}
.lay-h{display:flex;align-items:center;gap:8px;padding:0 12px 6px}
.lay-h b{font-size:13px;font-weight:650}
.count{font-size:11px;color:var(--text3);background:var(--fill);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.lay-h .sp{flex:1}
.lay-h .sel{width:150px;height:28px}
.lay-op{display:flex;align-items:center;gap:8px;padding:0 12px 6px;color:var(--text2);font-size:12px}
.lay-op .kbd{min-width:40px;text-align:right}
.lay-list{flex:1;overflow-y:auto;padding:2px 8px 4px;scrollbar-width:thin}
.layer{display:grid;grid-template-columns:26px 42px 1fr 26px;align-items:center;gap:8px;height:52px;padding:0 6px;border-radius:12px;margin-bottom:2px;cursor:pointer;transition:background .15s;animation:layIn .35s cubic-bezier(.2,1,.3,1)}
@keyframes layIn{from{opacity:0;transform:translateY(-4px)}}
.layer:hover{background:var(--hover)}
.layer.on{background:var(--sel);box-shadow:inset 0 0 0 1px var(--sel-b)}
.layer.dragging{opacity:.4}
.layer.drop-a{box-shadow:inset 0 2px 0 var(--accent)}
.layer.drop-b{box-shadow:inset 0 -2px 0 var(--accent)}
.layer .th{width:42px;height:42px;border-radius:9px;background:var(--checker);box-shadow:inset 0 0 0 1px var(--stroke);display:grid;place-items:center;overflow:hidden}
.layer .th canvas{width:42px;height:42px;display:block}
.layer .nm{min-width:0}
.layer .nm b{display:flex;align-items:center;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .nm b span.t{overflow:hidden;text-overflow:ellipsis}
.layer .nm small{display:block;color:var(--text3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .nm input{width:100%;height:24px;border-radius:6px;border:1px solid var(--accent);background:var(--glass-strong);padding:0 6px;outline:0}
.layer.hid .th,.layer.hid .nm{opacity:.38}
.mini{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text2);transition:.15s}
.mini:hover{background:var(--hover);color:var(--text)}
.mini.act{color:var(--accent)}
.fxb{font-size:9.5px;font-weight:750;color:var(--accent);background:rgba(10,132,255,.14);padding:1px 5px;border-radius:5px;margin-left:5px;flex:none}
.lay-f{display:flex;justify-content:space-between;padding:6px 8px 8px;border-top:1px solid var(--stroke)}

/* Zoom bar */
#zoombar{position:absolute;bottom:12px;left:calc(78px + (100% - 78px - 336px)/2);transform:translateX(-50%);height:40px;border-radius:14px;display:flex;align-items:center;gap:1px;padding:0 5px;z-index:24;animation:rise .7s .12s cubic-bezier(.2,1,.3,1) both;transition:left .45s cubic-bezier(.2,.9,.25,1)}
@keyframes rise{from{transform:translate(-50%,24px);opacity:0}}
#zoomval{min-width:60px;height:30px;border-radius:8px;font-weight:620;font-variant-numeric:tabular-nums}
#zoomval:hover{background:var(--hover)}
.zsep{width:1px;height:20px;background:var(--stroke2);margin:0 4px}
#cursorpos{font-size:11.5px;color:var(--text2);font-variant-numeric:tabular-nums;min-width:104px;padding:0 6px;white-space:nowrap}

/* Menus */
.menu{position:fixed;z-index:120;min-width:238px;padding:6px;border-radius:14px;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke);box-shadow:0 20px 60px rgba(0,0,0,.3),var(--hi);animation:menuIn .18s cubic-bezier(.2,.9,.3,1.1);transform-origin:top left;max-height:calc(100vh - 20px);overflow-y:auto}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.mi{width:100%;display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:8px;text-align:left;white-space:nowrap}
.mi .ic{color:var(--text2)}
.mi:hover,.mi.hl{background:var(--accent);color:#fff}
.mi:hover .ic,.mi:hover .kbd,.mi.hl .ic,.mi.hl .kbd{color:#fff}
.mi .kbd{margin-left:auto;padding-left:22px}
.mi.dis{opacity:.36;pointer-events:none}
.menu .sep{height:1px;background:var(--stroke);margin:5px 8px}
.mh{padding:7px 10px 4px;font-size:11px;color:var(--text3);font-weight:650}
.fontmenu{width:290px;padding:0;display:flex;flex-direction:column;max-height:min(520px,calc(100vh - 30px));overflow:hidden}
.fontmenu .fp-top{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--stroke)}
.fontmenu .fp-top input{flex:1;height:30px;border-radius:8px;background:var(--fill);border:1px solid transparent;padding:0 10px;outline:0;min-width:0}
.fontmenu .fp-top input:focus{border-color:var(--accent)}
.fp-list{overflow-y:auto;padding:4px 6px 8px}
.fp-list .mi{height:36px;font-size:17px}
.fp-list .mi.cur{background:var(--sel)}

/* Modal */
.backdrop{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--backdrop);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .25s ease;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
@keyframes fade{from{opacity:0}}
.backdrop.out{animation:fadeOut .2s forwards}
@keyframes fadeOut{to{opacity:0}}
.modal{width:min(var(--mw,560px),100%);max-height:100%;overflow:auto;border-radius:24px;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke);box-shadow:0 30px 80px rgba(0,0,0,.4),var(--hi);padding:22px;animation:pop .5s cubic-bezier(.2,1.25,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(12px)}}
.modal h2{font-size:19px;font-weight:720;letter-spacing:-.02em;margin-bottom:4px}
.modal .sub{color:var(--text2);margin-bottom:16px;line-height:1.45}
.modal-f{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.lbl{display:block;font-size:12px;color:var(--text2);margin:14px 0 6px;font-weight:550}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;max-height:300px;overflow:auto;padding:2px}
.preset{border-radius:14px;padding:12px 8px 10px;background:var(--fill);display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid transparent;transition:background .18s,transform .18s,border-color .18s}
.preset:hover{background:var(--fill2);transform:translateY(-2px)}
.preset.on{border-color:var(--accent);background:var(--sel)}
.preset .shape{height:44px;display:grid;place-items:center}
.preset .shape i{display:block;border:1.5px solid var(--text2);border-radius:4px;background:var(--fill2)}
.preset.on .shape i{border-color:var(--accent)}
.preset b{font-size:12px;font-weight:620;text-align:center}
.preset small{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.sizes{display:flex;gap:8px;align-items:center}
.sizes .field{flex:1}
.anchor{display:grid;grid-template-columns:repeat(3,28px);gap:4px}
.anchor button{width:28px;height:28px;border-radius:7px;background:var(--fill);display:grid;place-items:center}
.anchor button.on{background:var(--accent);color:#fff}
.exp{display:grid;grid-template-columns:230px 1fr;gap:18px}
.exp-prev{border-radius:14px;background:var(--checker);display:grid;place-items:center;min-height:200px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--stroke)}
.exp-prev canvas{max-width:100%;max-height:240px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.exp-info{color:var(--text2);font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.keyrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--stroke);font-size:12.5px}
.keyrow kbd{font:600 11.5px -apple-system,system-ui,sans-serif;background:var(--fill2);border-radius:6px;padding:3px 7px;color:var(--text);box-shadow:inset 0 -1px 0 var(--stroke2)}

/* Palette */
.palette{width:min(620px,100%);align-self:start;margin-top:10vh;border-radius:20px;overflow:hidden;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke);box-shadow:0 30px 80px rgba(0,0,0,.4),var(--hi);animation:pop .4s cubic-bezier(.2,1.25,.3,1)}
.pal-in{position:relative}
.pal-in .ic{position:absolute;left:18px;top:18px;color:var(--text3)}
.palette input{width:100%;height:56px;border:0;background:transparent;font-size:17px;padding:0 18px 0 50px;outline:0}
.pal-list{max-height:min(420px,55vh);overflow:auto;padding:6px;border-top:1px solid var(--stroke)}
.pal-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;width:100%;text-align:left}
.pal-item .ic{color:var(--text2)}
.pal-item small{color:var(--text3);font-size:11.5px}
.pal-item .kbd{margin-left:auto}
.pal-item.hl{background:var(--accent);color:#fff}
.pal-item.hl .ic,.pal-item.hl small,.pal-item.hl .kbd{color:#fff}

/* Float panel */
.fpanel{position:absolute;top:122px;left:calc(78px + (100% - 78px - 336px)/2);transform:translateX(-50%);width:min(360px,calc(100% - 24px));z-index:40;border-radius:20px;padding:16px;animation:drop .45s cubic-bezier(.2,1.25,.3,1)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px) scale(.97)}}
.fpanel.out{animation:fadeOut .2s forwards}
.fp-h{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:14px}
.fp-h .ic{color:var(--accent)}
.fp-f{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

/* Color picker */
.cp{position:fixed;z-index:260;width:256px;padding:12px;border-radius:18px;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke);box-shadow:0 24px 60px rgba(0,0,0,.35),var(--hi);animation:menuIn .2s cubic-bezier(.2,.9,.3,1.1)}
.cp-sv{position:relative;height:150px;border-radius:12px;overflow:hidden;cursor:crosshair;touch-action:none}
.cp-sv canvas{width:100%;height:100%;display:block}
.cp-dot{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.cp-bar{position:relative;height:14px;border-radius:8px;margin-top:11px;cursor:pointer;touch-action:none}
.cp-hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.cp-alpha{background:var(--checker)}
.cp-alpha>i{position:absolute;inset:0;border-radius:8px}
.cp-knob{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.45),inset 0 0 0 3px #fff;transform:translate(-50%,-50%);pointer-events:none}
.cp-row{display:flex;gap:6px;margin-top:11px;align-items:center}
.cp-row .num{flex:1;text-align:left;font-family:ui-monospace,"SF Mono",Menlo,monospace;height:30px}
.cp-sw{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.cp-sw button{aspect-ratio:1;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3);transition:transform .12s;background-color:transparent}
.cp-sw button:hover{transform:scale(1.18)}
.cp-t{font-size:11px;color:var(--text3);margin-top:9px;font-weight:600}

/* Welcome */
#welcome{position:absolute;inset:0;z-index:60;display:grid;place-items:center;padding:20px;overflow:auto;background:var(--backdrop);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#welcome.hide{display:none}
.wcard{width:min(780px,100%);border-radius:30px;padding:34px;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--stroke);box-shadow:0 40px 100px rgba(0,0,0,.28),var(--hi);animation:pop .8s cubic-bezier(.2,1.2,.3,1)}
.whero{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.whero svg{width:72px;height:72px;flex:none;animation:spinIn 1.1s cubic-bezier(.2,1.3,.3,1)}
@keyframes spinIn{from{transform:rotate(-60deg) scale(.4);opacity:0}}
.whero h1{font-size:34px;font-weight:760;letter-spacing:-.035em;line-height:1.05}
.whero p{color:var(--text2);font-size:14.5px;margin-top:7px;max-width:52ch;line-height:1.45}
.wacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.wact{border-radius:18px;padding:16px;background:var(--fill);text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .25s cubic-bezier(.2,1.3,.4,1),background .2s,box-shadow .25s;border:1px solid var(--stroke);position:relative;overflow:hidden}
.wact:hover{transform:translateY(-4px);background:var(--fill2);box-shadow:0 14px 34px rgba(0,0,0,.16)}
.wact .wi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff}
.wact b{font-size:14.5px;font-weight:650}
.wact small{color:var(--text2);line-height:1.4}
.wact img{position:absolute;right:12px;top:12px;width:64px;height:64px;object-fit:cover;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.2);background:var(--checker)}
.wquick{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;align-items:center}
.wquick span{color:var(--text3);font-size:12px;margin-right:4px}
.wdrop{margin-top:18px;border:1.5px dashed var(--stroke2);border-radius:16px;padding:14px;text-align:center;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:9px}

/* Drop overlay, toast, tooltip */
#dropHint{position:fixed;inset:12px;z-index:500;border-radius:26px;border:2.5px dashed var(--accent);background:rgba(10,132,255,.12);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;place-items:center;pointer-events:none}
#dropHint.show{display:grid;animation:fade .2s}
#dropHint div{padding:18px 26px;border-radius:18px;background:var(--glass-strong);font-size:16px;font-weight:650;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
#toasts{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none}
.toast{padding:10px 14px 10px 13px;border-radius:14px;background:var(--toast-bg);color:var(--toast-fg);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 10px 30px rgba(0,0,0,.28);font-weight:560;display:flex;gap:9px;align-items:center;animation:toastIn .5s cubic-bezier(.2,1.3,.3,1);max-width:min(560px,90vw)}
.toast.out{animation:toastOut .3s forwards}
.toast button{margin-left:6px;height:26px;padding:0 10px;border-radius:7px;background:var(--accent);color:#fff;font-weight:600;font-size:12px}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}
#tip{position:fixed;z-index:400;padding:5px 9px;border-radius:8px;background:var(--toast-bg);color:var(--toast-fg);font-size:12px;font-weight:550;pointer-events:none;opacity:0;transition:opacity .15s;display:flex;gap:8px;align-items:center;white-space:nowrap}
#tip.show{opacity:1}
#tip .kbd{color:inherit;opacity:.6}

@media (max-width:900px){
  #inspector{width:300px}
  #inspector{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
  #inspector.open{transform:none;opacity:1;pointer-events:auto}
  #optbar{right:10px !important}
  #zoombar{left:calc(50% + 34px) !important}
  .fpanel{left:50%}
  .menus{display:none}
  .only-narrow{display:grid}
  #cursorpos{display:none}
}
@media (max-width:640px){
  .doctab small,.doctab .tth{display:none}
  .doctab{min-width:70px}
  .brand span{display:none}
  #btnExport span,#btnSave span{display:none}
  .exp{grid-template-columns:1fr}
  .keys{grid-template-columns:1fr}
  .whero{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  #aurora i{animation:none}
}

function drawSel(x,sel,t){ const p=sel.path||selPath(sel); const {z,x:vx,y:vy}=S.view; x.save(); x.setTransform(dpr*z,0,0,dpr*z,dpr*vx,dpr*vy); x.lineWidth=1/z; x.setLineDash([5/z,5/z]); const o=(t/45)%10; x.strokeStyle='#000'; x.lineDashOffset=-o/z; x.stroke(p); x.strokeStyle='#fff'; x.lineDashOffset=-(o+5)/z; x.stroke(p); if(!sel.inv&&S.selDraft){ x.fillStyle='rgba(10,132,255,.08)'; x.fill(p); } x.restore(); }

const H={list:[],i:-1};
function cloneLayer(L){ const o={}; for(const k in L){ if(k[0]==='_'||k==='canvas') continue; o[k]=L[k]; } const c=JSON.parse(JSON.stringify(o)); if(L.canvas) c.canvas=L.canvas; c._dirty=true; return c; }
function snapshot(){ return {doc:{...S.doc},layers:S.layers.map(cloneLayer),active:S.active}; }
function pushHistory(name){ if(!S.doc) return; H.list.splice(H.i+1); H.list.push({name,state:snapshot(),t:Date.now()}); if(H.list.length>60) H.list.shift(); H.i=H.list.length-1; onDocChanged(); }
function resetHistory(name){ H.list=[]; H.i=-1; pushHistory(name); }
function restore(st){ if(CP){ CP.el.remove(); CP=null; } S.doc={...st.doc}; S.layers=st.layers.map(cloneLayer); S.layers.forEach(L=>{ L._thumbDirty=true; }); S.active=byId(st.active)?st.active:null; S.warp=null; ensureDocCanvas(); need.comp=true; closeFloat(false); renderLayers(); renderInspector(); renderOptBar(); updTitle(); updUndo(); scheduleAutosave(); }
function undo(){ if(S.warp){ cancelWarp(); return; } if(H.i>0){ H.i--; restore(H.list[H.i].state); toast('Rückgängig: '+H.list[H.i+1].name,{icon:'undo',ms:1400}); } }
function redo(){ if(H.i<H.list.length-1){ H.i++; restore(H.list[H.i].state); toast('Wiederholt: '+H.list[H.i].name,{icon:'redo',ms:1400}); } }
function jumpHistory(i){ if(i<0||i>=H.list.length) return; H.i=i; restore(H.list[i].state); }
function ensureDocCanvas(){ if(!S.doc) return; if(docCanvas.width!==S.doc.w||docCanvas.height!==S.doc.h){ docCanvas.width=S.doc.w; docCanvas.height=S.doc.h; } need.comp=true; }

/* ================= Ebenen-Operationen ================= */
function setActive(id){ const wasMulti=pickCount()>1; if(S.active===id&&!wasMulti) return; S.active=id; S.picked=null; S.pickAnchor=null; if(S.tool==='move'&&S.doc) renderOptBar(); const L0=byId(id); if(L0) ancestors(L0).forEach(g=>g.collapsed=false); closeFloat(true); renderLayers(); renderInspector(); updLayerHeader(); need.view=true; }
function addLayer(L,atTop){ const A=activeLayer(); if(L.parent===undefined) L.parent=(!atTop&&A)?(isGroup(A)?A.id:pid(A)):null; if(atTop||!A) S.layers.push(L); else if(isGroup(A)) S.layers.splice(idxOf(A.id),0,L); else S.layers.splice(idxOf(A.id)+1,0,L); normalizeOrder(); L._thumbDirty=true; S.active=L.id; need.comp=true; renderLayers(); renderInspector(); updLayerHeader(); return L; }
function newEmptyLayer(name='Ebene'){ const L=makeRaster(newCanvas(S.doc.w,S.doc.h),name); L.x=S.doc.w/2; L.y=S.doc.h/2; return addLayer(L); }
function activeRaster(create,name){ const L=activeLayer(); if(L&&L.type==='raster') return L; if(!create) return null; const N=newEmptyLayer(name||'Ebene'); toast('Neue Ebene „'+N.name+'“ erstellt',{icon:'newLayer',ms:1600}); return N; }
function editPixels(L,fn){ const c=cloneCanvas(L.canvas); fn(c,c.getContext('2d')); L.canvas=c; touch(L); }
function uniqueName(base){ let n=base,i=2; const names=new Set(S.layers.map(l=>l.name)); while(names.has(n)) n=`${base} ${i++}`; return n; }
function dupLayer(L,offset=true){ if(!L) return; const items=[L,...(isGroup(L)?descendants(L.id):[])]; const map=new Map(); const clones=items.map(o=>{ const c=cloneLayer(o); c.id=uid(); map.set(o.id,c.id); c._thumbDirty=true; return c; }); clones.forEach((c,i)=>{ if(i>0) c.parent=map.get(items[i].parent)||null; else c.name=uniqueName(L.name.replace(/ Kopie( \d+)?$/,'')+' Kopie'); if(offset&&!isGroup(c)){ c.x+=20; c.y+=20; } }); S.layers.splice(idxOf(L.id)+1,0,...clones); normalizeOrder(); S.active=clones[0].id; need.comp=true; renderLayers(); renderInspector(); return clones[0]; }
function delLayer(L){ if(!L) return; const ids=new Set([L.id,...(isGroup(L)?descendants(L.id).map(x=>x.id):[])]); const sib=S.layers.filter(l=>pid(l)===pid(L)&&!ids.has(l.id)); const si=S.layers.filter(l=>pid(l)===pid(L)).indexOf(L); const keep=S.layers.filter(l=>!ids.has(l.id)); S.layers.splice(0,S.layers.length,...keep); const n=sib[Math.max(0,si-1)]||sib[0]||byId(pid(L))||S.layers[S.layers.length-1]; S.active=n?n.id:null; if(S.warp&&ids.has(S.warp.id)) S.warp=null; need.comp=true; pushHistory(isGroup(L)?'Ordner gelöscht':'Ebene gelöscht'); renderInspector(); }
function moveLayer(L,dir){ if(!L) return; const sib=S.layers.filter(l=>pid(l)===pid(L)); const i=sib.indexOf(L); let j=dir==='top'?sib.length-1:dir==='bottom'?0:i+dir; j=clamp(j,0,sib.length-1); if(i===j) return; const other=sib[j]; S.layers.splice(idxOf(L.id),1); const t=idxOf(other.id); S.layers.splice(j>i?t+1:t,0,L); normalizeOrder(); need.comp=true; pushHistory('Anordnung geändert'); }
function moveLayerTo(srcId,targetId,mode){ if(srcId===targetId) return; const L=byId(srcId), T=byId(targetId); if(!L||!T) return; if(isGroup(L)&&ancestors(T).includes(L)) return toast('Ein Ordner kann nicht in sich selbst liegen.'); S.layers.splice(idxOf(srcId),1); if(mode==='into'&&isGroup(T)){ L.parent=T.id; T.collapsed=false; S.layers.splice(idxOf(T.id),0,L); } else { L.parent=pid(T); const t=idxOf(T.id); S.layers.splice(mode==='above'?t+1:t,0,L); } normalizeOrder(); S.active=L.id; need.comp=true; pushHistory(mode==='into'?'In Ordner verschoben':'Ebene verschoben'); }
const RASTER_DROP=['text','font','size','weight','italic','spacing','lineH','align','upper','curve','fill','stroke','bg','kind','radius','points','inner','sides','runs'];
function rasterize(L,silent){ if(!L||L.type==='raster') return; if(isGroup(L)){ if(!silent) toast('Ordner lassen sich nicht rastern – nutze „Zu einer Ebene zusammenfügen“.'); return; } const W=Math.max(1,Math.ceil(L.w)),Hh=Math.max(1,Math.ceil(L.h)); const c=newCanvas(W,Hh),x=c.getContext('2d'); x.scale(W/L.w,Hh/L.h); drawContent(x,L,L.w,L.h); for(const k of RASTER_DROP) delete L[k]; L.type='raster'; L.canvas=c; L.nw=W; L.nh=Hh; L._lay=null; touch(L); if(!silent){ pushHistory('Gerastert'); renderInspector(true); toast('Ebene in Pixel umgewandelt',{icon:'image'}); } }
function mergeDown(){ const L=activeLayer(); if(!L) return; if(isGroup(L)) return mergeGroup(L); const sib=S.layers.filter(l=>pid(l)===pid(L)); const B=sib[sib.indexOf(L)-1]; if(!B) return toast('Unter dieser Ebene liegt keine Ebene.'); if(isGroup(B)) return toast('Darunter liegt ein Ordner – füge ihn zuerst zusammen.'); const c=newCanvas(S.doc.w,S.doc.h),x=c.getContext('2d'); const base=new DOMMatrix(); for(const E of [B,L]) if(E.visible) drawLayer(x,E,base); const N=makeRaster(c,B.name); N.x=S.doc.w/2; N.y=S.doc.h/2; N.parent=pid(B); N.color=B.color; S.layers.splice(idxOf(L.id),1); S.layers.splice(idxOf(B.id),1,N); trimLayer(N,true); S.active=N.id; need.comp=true; pushHistory('Auf eine Ebene reduziert'); renderInspector(); }
function flatten(){ if(!S.layers.length) return; const c=newCanvas(S.doc.w,S.doc.h); composite(c.getContext('2d'),new DOMMatrix(),{noWarp:true}); const N=makeRaster(c,'Hintergrund'); N.x=S.doc.w/2; N.y=S.doc.h/2; S.layers=[N]; S.active=N.id; S.warp=null; need.comp=true; pushHistory('Alle Ebenen zusammengefügt'); renderInspector(); }
function trimLayer(L,silent){ if(!L||L.type!=='raster'){ toast('Trimmen funktioniert bei Bildebenen.'); return false; } const c=L.canvas,W=c.width,Hh=c.height,d=getID(c).data; let x0=W,y0=Hh,x1=-1,y1=-1; for(let y=0;y<Hh;y++){ const o=y*W; for(let x=0;x<W;x++) if(d[(o+x)*4+3]>3){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; y1=y; } } if(x1<0){ toast('Die Ebene ist leer.'); return false; } const nw=x1-x0+1,nh=y1-y0+1; if(nw===W&&nh===Hh){ if(!silent) toast('Keine transparenten Ränder gefunden.'); return false; } const n=newCanvas(nw,nh); n.getContext('2d').drawImage(c,-x0,-y0); const sx=L.w/W,sy=L.h/Hh; const p=lm(L).transformPoint(new DOMPoint((x0+nw/2)*sx-L.w/2,(y0+nh/2)*sy-L.h/2)); L.canvas=n; L.w=nw*sx; L.h=nh*sy; L.nw=nw; L.nh=nh; L.x=p.x; L.y=p.y; touch(L); if(!silent){ pushHistory('Ränder getrimmt'); toast('Transparente Ränder entfernt',{icon:'trim'}); } return true; }
function alignLayer(L,how){ if(!L) return; if(isGroup(L)) return alignGroup(L,how); const b=aabb(L), W=S.doc.w, Hh=S.doc.h; if(how==='l') L.x+=-b.x0; if(how==='r') L.x+=W-b.x1; if(how==='ch') L.x+=W/2-(b.x0+b.x1)/2; if(how==='t') L.y+=-b.y0; if(how==='b') L.y+=Hh-b.y1; if(how==='cv') L.y+=Hh/2-(b.y0+b.y1)/2; if(how==='c'){ L.x+=W/2-(b.x0+b.x1)/2; L.y+=Hh/2-(b.y0+b.y1)/2; } need.comp=true; pushHistory('Ausgerichtet'); }
function fitLayer(L,cover){ if(!L||noGroup(L,'Einpassen')) return; L.rot=0; L.skx=0; L.sky=0; const r=cover?Math.max(S.doc.w/L.w,S.doc.h/L.h):Math.min(S.doc.w/L.w,S.doc.h/L.h); L.w*=r; L.h*=r; L.x=S.doc.w/2; L.y=S.doc.h/2; touch(L); pushHistory(cover?'Leinwand gefüllt':'In Leinwand eingepasst'); }
function flipLayer(L,axis){ if(!L) return; if(isGroup(L)) return flipGroup(L,axis); if(axis==='h') L.flipX=!L.flipX; else L.flipY=!L.flipY; need.comp=true; pushHistory(axis==='h'?'Horizontal gespiegelt':'Vertikal gespiegelt'); }
function rotateLayer(L,d){ if(!L) return; if(isGroup(L)) return rotateGroup(L,d>0?1:-1); L.rot=normAng(L.rot+d); need.comp=true; pushHistory('Gedreht'); }
function resetSize(L){ if(!L||noGroup(L,'Originalgröße')) return; if(L.type==='raster'){ L.w=L.canvas.width; L.h=L.canvas.height; } else if(L.type==='text'){ L.w=L.nw; L.h=L.nh; } touch(L); pushHistory('Originalgröße'); }
function copyStyle(L){ if(!L||noGroup(L,'Ebenenstil kopieren')) return; S.styleClip=JSON.parse(JSON.stringify({fx:L.fx,adj:L.adj,opacity:L.opacity,blend:L.blend,fillOp:L.fillOp??1})); toast('Ebenenstil kopiert',{icon:'copy'}); }
function pasteStyle(L){ if(L&&noGroup(L,'Ebenenstil einfügen')) return; if(!L||!S.styleClip) return toast('Kopiere zuerst einen Ebenenstil.'); Object.assign(L,JSON.parse(JSON.stringify(S.styleClip))); touch(L); pushHistory('Ebenenstil eingefügt'); renderInspector(true); }
/* Dokument */
function applyCanvasSize(w,hh,ax,ay){ const dx=(w-S.doc.w)*ax, dy=(hh-S.doc.h)*ay; S.layers.forEach(L=>{ L.x+=dx; L.y+=dy; }); S.doc.w=w; S.doc.h=hh; S.sel=null; ensureDocCanvas(); pushHistory('Leinwandgröße geändert'); fitView(); updTitle(); }
function applyImageSize(w,hh){ const sx=w/S.doc.w, sy=hh/S.doc.h; S.layers.forEach(L=>{ L.x*=sx; L.y*=sy; L.w*=sx; L.h*=sy; touch(L); }); S.doc.w=w; S.doc.h=hh; S.sel=null; ensureDocCanvas(); pushHistory('Bildgröße geändert'); fitView(); updTitle(); }
function rotateCanvas(dir){ const W=S.doc.w,Hh=S.doc.h; S.layers.forEach(L=>{ const x=L.x,y=L.y; if(dir>0){ L.x=Hh-y; L.y=x; } else { L.x=y; L.y=W-x; } L.rot=normAng(L.rot+90*dir); }); S.doc.w=Hh; S.doc.h=W; S.sel=null; ensureDocCanvas(); pushHistory('Leinwand gedreht'); fitView(); updTitle(); }
function flipCanvas(axis){ S.layers.forEach(L=>{ if(axis==='h'){ L.x=S.doc.w-L.x; L.flipX=!L.flipX; } else { L.y=S.doc.h-L.y; L.flipY=!L.flipY; } L.rot=normAng(-L.rot); L.skx=-L.skx; L.sky=-L.sky; }); need.comp=true; pushHistory('Leinwand gespiegelt'); }
function initCrop(){ const r=S.opts.crop.ratio; let w=S.doc.w,hh=S.doc.h; if(r){ if(w/hh>r) w=hh*r; else hh=w/r; } S.crop={x:(S.doc.w-w)/2,y:(S.doc.h-hh)/2,w,h:hh}; need.view=true; }
function applyCrop(){ if(!S.crop) return; const c=S.crop; const x=Math.round(c.x),y=Math.round(c.y),w=Math.max(1,Math.round(c.w)),hh=Math.max(1,Math.round(c.h)); S.layers.forEach(L=>{ L.x-=x; L.y-=y; }); S.doc.w=w; S.doc.h=hh; S.crop=null; S.sel=null; ensureDocCanvas(); pushHistory('Zugeschnitten'); setTool('move'); fitView(); updTitle(); toast(`Zugeschnitten auf ${w} × ${hh} px`,{icon:'crop'}); }
function cancelCrop(){ S.crop=null; if(S.tool==='crop') setTool('move'); need.view=true; }
/* Verzerren */
function startWarp(){ const L=activeLayer(); if(!L) return toast('Wähle zuerst eine Ebene aus.'); if(noGroup(L,'Verzerren')) return; if(L.type!=='raster'){ rasterize(L,true); pushHistory('Gerastert'); } S.warp={id:L.id,pts:layerCorners(L).map(p=>({x:p.x,y:p.y})),dragging:false}; setTool('move'); need.comp=true; renderOptBar(); renderInspector(true); toast('Ziehe die Ecken, um frei zu verzerren',{icon:'distort'}); }

function cancelWarp(){ S.warp=null; need.comp=true; renderOptBar(); renderInspector(true); }

/* ================= Auswahl ================= */
function selPath(s){ const p=new Path2D(); if(s.inv) p.rect(-1e5,-1e5,2e5,2e5); if(s.kind==='rect') p.rect(s.x,s.y,s.w,s.h); else if(s.kind==='ellipse'){ const rx=Math.max(.1,s.w/2),ry=Math.max(.1,s.h/2); p.moveTo(s.x+s.w/2+rx,s.y+s.h/2); p.ellipse(s.x+s.w/2,s.y+s.h/2,rx,ry,0,0,Math.PI*2); } else if(s.pts&&s.pts.length){ s.pts.forEach((q,i)=>i?p.lineTo(q.x,q.y):p.moveTo(q.x,q.y)); p.closePath(); } return p; }
function finalizeSel(s){ s.inv=!!s.inv; if(s.kind==='lasso'){ const xs=s.pts.map(p=>p.x),ys=s.pts.map(p=>p.y); s.x=Math.min(...xs); s.y=Math.min(...ys); s.w=Math.max(...xs)-s.x; s.h=Math.max(...ys)-s.y; } s.path=selPath(s); return s; }
function clipSel(ctx,m){ if(!S.sel) return; ctx.setTransform(m); ctx.clip(S.sel.path,S.sel.inv?'evenodd':'nonzero'); ctx.setTransform(1,0,0,1,0,0); }
function selBox(){ const s=S.sel; if(!s) return null; if(s.inv) return {x:0,y:0,w:S.doc.w,h:S.doc.h}; return {x:s.x,y:s.y,w:s.w,h:s.h}; }
function selectAll(){ if(!S.doc) return; S.sel=finalizeSel({kind:'rect',x:0,y:0,w:S.doc.w,h:S.doc.h}); renderOptBar(); need.view=true; }
function deselect(){ S.sel=null; renderOptBar(); need.view=true; }
function invertSel(){ if(!S.sel) return selectAll(); S.sel.inv=!S.sel.inv; S.sel.path=selPath(S.sel); need.view=true; }
function selRequireRaster(){ const L=activeLayer(); if(!L){ toast('Wähle eine Ebene aus.'); return null; } if(L.type!=='raster'){ toast('Diese Aktion funktioniert bei Bildebenen.',{action:{label:'Rastern',run:()=>rasterize(L)}}); return null; } return L; }
function clearSelection(){ const L=selRequireRaster(); if(!L||!S.sel) return; editPixels(L,(c,x)=>{ x.save(); clipSel(x,nativeMat(L).inverse()); x.clearRect(0,0,c.width,c.height); x.restore(); }); pushHistory('Auswahl gelöscht'); }
function fillSelection(){ if(!S.sel) return; const L=activeRaster(true,'Füllung'); editPixels(L,(c,x)=>{ x.save(); clipSel(x,nativeMat(L).inverse()); x.fillStyle=S.primary; x.fillRect(0,0,c.width,c.height); x.restore(); }); pushHistory('Auswahl gefüllt'); }
function selToLayer(cut){ const L=selRequireRaster(); if(!L||!S.sel) return; const c=newCanvas(L.canvas.width,L.canvas.height),x=c.getContext('2d'); x.save(); clipSel(x,nativeMat(L).inverse()); x.drawImage(L.canvas,0,0); x.restore(); const N=cloneLayer(L); N.id=uid(); N.canvas=c; N.name=uniqueName(cut?'Ausgeschnitten':'Auswahl'); if(cut) editPixels(L,(cc,xx)=>{ xx.save(); clipSel(xx,nativeMat(L).inverse()); xx.clearRect(0,0,cc.width,cc.height); xx.restore(); }); S.layers.splice(idxOf(L.id)+1,0,N); S.active=N.id; trimLayer(N,true); S.sel=null; pushHistory(cut?'Auf neue Ebene ausgeschnitten':'Auf neue Ebene kopiert'); renderOptBar(); renderInspector(); }
function cropToSel(){ const b=selBox(); if(!b) return; S.crop={...b}; applyCrop(); }

function floodMask(img,x,y,tol,contig){
  const {width:W,height:Hh,data:d}=img; const m=new Uint8Array(W*Hh); if(x<0||y<0||x>=W||y>=Hh) return m;
  const i0=(y*W+x)*4, r0=d[i0],g0=d[i0+1],b0=d[i0+2],a0=d[i0+3], t=tol*2.55;
  const match=i=>{ const j=i*4, a=d[j+3]; if(a0<10&&a<10) return true; return Math.abs(d[j]-r0)<=t&&Math.abs(d[j+1]-g0)<=t&&Math.abs(d[j+2]-b0)<=t&&Math.abs(a-a0)<=t; };
  if(!contig){ for(let i=0;i<W*Hh;i++) if(match(i)) m[i]=1; return m; }
  const st=[x,y];
  while(st.length){ const py=st.pop(); let px=st.pop(); while(px>=0&&!m[py*W+px]&&match(py*W+px)) px--; px++; let up=false,dn=false;
    while(px<W){ const i=py*W+px; if(m[i]||!match(i)) break; m[i]=1;
      if(py>0){ const u=i-W; if(!m[u]&&match(u)){ if(!up){ st.push(px,py-1); up=true; } } else up=false; }
      if(py<Hh-1){ const v=i+W; if(!m[v]&&match(v)){ if(!dn){ st.push(px,py+1); dn=true; } } else dn=false; }
      px++; } }
  return m;
}
function boxBlur(src,W,Hh,r){ r=Math.max(1,Math.round(r)); const tmp=new Float32Array(W*Hh),out=new Float32Array(W*Hh),inv=1/(2*r+1);

  for(let x=0;x<W;x++){ let acc=0; for(let y=-r;y<=r;y++) acc+=tmp[clamp(y,0,Hh-1)*W+x]; for(let y=0;y<Hh;y++){ out[y*W+x]=acc*inv; acc+=tmp[Math.min(Hh-1,y+r+1)*W+x]-tmp[Math.max(0,y-r)*W+x]; } }
  return out; }

function maskToCanvas(m,W,Hh,col){ const id=new ImageData(W,Hh),d=id.data; for(let i=0;i<m.length;i++) if(m[i]){ const j=i*4; d[j]=col.r; d[j+1]=col.g; d[j+2]=col.b; d[j+3]=Math.round(255*col.a); } return fromID(id); }
function borderColors(d,W,Hh){ const map=new Map(); let n=0,tr=0; const step=Math.max(1,Math.floor((W+Hh)/900)); const add=(x,y)=>{ const i=(y*W+x)*4; n++; if(d[i+3]<16){ tr++; return; } const k=(d[i]>>4)<<8|(d[i+1]>>4)<<4|(d[i+2]>>4); const e=map.get(k)||{c:0,r:0,g:0,b:0}; e.c++; e.r+=d[i]; e.g+=d[i+1]; e.b+=d[i+2]; map.set(k,e); };
  for(let x=0;x<W;x+=step){ add(x,0); add(x,Hh-1); } for(let y=0;y<Hh;y+=step){ add(0,y); add(W-1,y); }

function bgRemove(id,{tol=25,feather=1.5,choke=0,mode='edge'}){

function convolve(id,k,bias=0,gray=false){ const {width:W,height:Hh,data:s}=id; const out=new ImageData(W,Hh),o=out.data;

function runFilter(fid){

  const orig=L.canvas; const v={}; F.params.forEach(p=>v[p.k]=p.val);
  if(!F.params.length){ L.canvas=F.run(orig,v); touch(L); pushHistory(F.name); toast(F.name+' angewendet',{icon:F.icon}); return; }
  const apply=debounce(()=>{ if(byId(L.id)!==L) return; L.canvas=F.run(orig,v); touch(L); },70); apply();
  CUR_UPD=[]; const body=h('div',{},F.params.map(p=>p.type==='switch'?switchRow(p.label,()=>v[p.k],x=>{v[p.k]=x; apply();}):p.type==='color'?ctlColor(p.label,()=>v[p.k],x=>{v[p.k]=x; apply();},null):ctlSlider(p.label,{min:p.min,max:p.max,step:p.step,get:()=>v[p.k],set:x=>{v[p.k]=x; apply();},commit:null})));
  floatPanel({title:F.name,icon:F.icon,body,onApply:()=>{ setTimeout(()=>{ L.canvas=F.run(orig,v); touch(L); pushHistory(F.name); },80); },onCancel:()=>{ L.canvas=orig; touch(L); }});
}

function stickerize(L,skipRemove){ L=L||activeLayer(); if(!L) return toast('Wähle zuerst eine Ebene aus.'); if(noGroup(L,'Der Sticker-Effekt')) return; if(L.type==='raster'&&!skipRemove){ const id=getID(L.canvas); if(borderColors(id.data,id.width,id.height).trans<.5) L.canvas=bgRemove(id,{tol:22,feather:1,mode:'edge'}); trimLayer(L,true); } const s=Math.max(4,Math.round(Math.min(L.w,L.h)*.035)); L.fx.outline={on:true,color:'#ffffff',width:s}; L.fx.shadow={on:true,color:'#0000005c',blur:Math.round(s*2.4),dx:0,dy:Math.round(s*.9)}; touch(L); pushHistory('Sticker-Effekt'); renderInspector(true); toast('Sticker-Effekt angewendet',{icon:'sticker'}); }

/* ---- Mehrfachauswahl ---- */
function pickedLayers(){ if(!S.active) return []; if(S.pickAnchor!==S.active||!S.picked) return [activeLayer()].filter(Boolean); return S.layers.filter(l=>S.picked.has(l.id)); }
function pickCount(){ return pickedLayers().length; }
function topPicked(){ const ls=pickedLayers(), set=new Set(ls.map(l=>l.id)); return ls.filter(l=>!ancestors(l).some(g=>set.has(g.id))); }
function pickLeaves(){ const out=[], seen=new Set(); for(const L of topPicked()) for(const l of (isGroup(L)?groupLeaves(L):[L])) if(!seen.has(l.id)&&!effLocked(l)){ seen.add(l.id); out.push(l); } return out; }

  let k=e.key; if(k.length===1&&/[a-z]/i.test(k)) k=k.toLowerCase(); else if(/^Key[A-Z]$/.test(e.code)&&(e.altKey||e.metaKey)&&!(e.ctrlKey&&e.altKey)) k=e.code.slice(3).toLowerCase(); else if(/^Digit\d$/.test(e.code)&&!e.shiftKey) k=e.code.slice(5); else if(k.length===1) k=k.toLowerCase();

  const combo=(mod&&!(e.ctrlKey&&e.altKey)?'mod+':'')+(e.shiftKey?'shift+':'')+(e.altKey&&!(e.ctrlKey&&e.altKey)?'alt+':'')+k;
  if(KEYMAP[combo]){ const id=KEYMAP[combo], a=ACT[id]; e.preventDefault(); if(!S.doc&&!['new','open','palette'].includes(id)) return; if(!a.enabled||a.enabled()) a.run(); return; }
  if(!S.doc) return;
  if(k==='['||k===']'){ e.preventDefault(); const o=S.tool==='eraser'?S.opts.eraser:S.opts.brush; o.size=clamp(Math.round(o.size*(k===']'?1.15:1/1.15)+(k===']'?1:-1)),1,500); if(S.tool==='brush'||S.tool==='eraser') renderOptBar(); need.view=true; setCursor(cursorForTool()); saveOptsSoon(); return; }
  if(k==='Escape'){ closeMenus(0); if(S.cutLine){ S.cutLine=null; need.view=true; renderOptBar(); return; } if(FP) closeFloat(true); else if(S.warp) cancelWarp(); else if(S.crop) cancelCrop(); else if(S.sel) deselect(); else if(S.active) setActive(null); return; }
  if(k==='Enter'){ if(S.warp){ applyWarp(); return; } if(S.crop){ applyCrop(); return; } const L=activeLayer(); if(L&&L.type==='text'){ e.preventDefault(); focusText(true); } return; }
  if(k==='Delete'||k==='Backspace'){ e.preventDefault(); if(hasL()) ACT.del.run(); return; }
  if(mod) return;
  if(k.startsWith('Arrow')){ const L=activeLayer(); if(!L||effLocked(L)) return; e.preventDefault(); const s=e.shiftKey?10:1; const dx=k==='ArrowLeft'?-s:k==='ArrowRight'?s:0, dy=k==='ArrowUp'?-s:k==='ArrowDown'?s:0; if(pickCount()>1) pickLeaves().forEach(l=>{ l.x+=dx; l.y+=dy; }); else if(isGroup(L)) shiftGroup(L,dx,dy); else { L.x+=dx; L.y+=dy; } need.comp=true; S.panelDirty=true; nudgeCommit(); return; }
  if(e.key==='?'){ dlgShortcuts(); return; }
  if(e.shiftKey&&k==='g'){ setTool('gradient'); return; }
  if(e.altKey||e.shiftKey) return;
  if(k==='l'){ S.opts.select.mode='lasso'; setTool('select'); return; }
  if(TOOLKEYS[k]){ setTool(TOOLKEYS[k]); return; }
  if(k==='x'){ swapColors(); return; } if(k==='d'){ defaultColors(); return; }
  if(/^\d$/.test(k)&&S.tool==='move'){ const L=activeLayer(); if(!L) return; L.opacity=k==='0'?1:(+k)/10; need.comp=true; updLayerHeader(); opCommit(); toast(`Deckkraft ${Math.round(L.opacity*100)} %`,{icon:'drop',ms:900}); }
});
document.addEventListener('keyup',e=>{ if(e.key===' '){ spaceDown=false; if(!panning) setCursor(cursorForTool()); } });
window.addEventListener('blur',()=>{ spaceDown=false; });
document.addEventListener('paste',e=>{ const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return; if(document.querySelector('.backdrop')) return; const cd=e.clipboardData; const files=[...(cd?cd.items:[])].filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean); if(files.length){ e.preventDefault(); handleFiles(files); return; } const txt=cd?cd.getData('text/plain'):''; if(!S.doc) return; if(S.clip&&(!txt||txt===S.clipMark||!S.clipMarkOK)){ e.preventDefault(); pasteLayer(); return; } if(txt&&txt.trim()){ e.preventDefault(); const L=makeText(txt.slice(0,3000)); L.size=Math.round(clamp(Math.min(S.doc.w,S.doc.h)*.07,14,500)); relayout(L,true); L.x=S.doc.w/2; L.y=S.doc.h/2; addLayer(L); ensureFont(L); pushHistory('Text eingefügt'); } });
let dragDepth=0; const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
addEventListener('dragenter',e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('#dropHint').classList.add('show'); });
addEventListener('dragover',e=>{ if(hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave',e=>{ if(!hasFiles(e)) return; dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) $('#dropHint').classList.remove('show'); });
addEventListener('drop',e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth=0; $('#dropHint').classList.remove('show'); handleFiles(e.dataTransfer.files); });

/* ================= Render-Schleife ================= */
let lastThumb=0, lastAnts=0;
function loop(t){
  requestAnimationFrame(loop);
  if(viewAnim){ const a=viewAnim, k=clamp((t-a.t0)/a.ms,0,1), ee=1-Math.pow(1-k,3); Object.assign(S.view,{z:Math.exp(lerp(Math.log(a.from.z),Math.log(a.tg.z),ee)),x:lerp(a.from.x,a.tg.x,ee),y:lerp(a.from.y,a.tg.y,ee)}); need.view=true; updZoomUI(); if(k>=1) viewAnim=null; }
  if(frameTasks.size){ for(const f of frameTasks) f(); frameTasks.clear(); }
  if(!S.doc){ if(need.view){ need.view=false; drawView(t); } return; }
  if(need.comp){ need.comp=false; composite(dctx); need.view=true; if(curDoc) curDoc._td=true; }
  if((S.sel||S.selDraft)&&t-lastAnts>45){ lastAnts=t; need.view=true; }
  if(need.view){ need.view=false; drawView(t); }
  if(S.panelDirty){ S.panelDirty=false; syncInspector(); updLayerHeader(); }
  if(t-lastThumb>260){ lastThumb=t; if(curDoc&&curDoc._td){ curDoc._td=false; drawTabThumb(); } for(const L of S.layers) if(L._thumbDirty&&L._thumb){ L._thumbDirty=false; drawThumb(L); } }
}

/* ================= Start ================= */
async function init(){
  $$('[data-ic]').forEach(el=>el.insertAdjacentHTML('afterbegin',ic(el.dataset.ic,+el.dataset.s||18)));
  loadPrefs(); updThemeIcon();
  buildDock(); buildMenubar(); buildLayersPanel(); renderTabs(); loadGoogleFonts();
  $('#btnUndo').onclick=undo; $('#btnRedo').onclick=redo; $('#btnSearch').onclick=openPalette; $('#btnTheme').onclick=toggleTheme; $('#btnPanel').onclick=togglePanel;
  $('#btnExport').onclick=()=>S.doc?dlgExport():toast('Erstelle oder öffne zuerst ein Projekt.');
  $('#btnNewTab').onclick=e=>newTabMenu(e.currentTarget);
  $('#btnSave').onclick=e=>{ if(!S.doc) return toast('Erstelle oder öffne zuerst ein Projekt.'); const r=e.currentTarget.getBoundingClientRect(); openMenu([{header:'Speichern'},'savePsd','saveProject','-','export','copyImage'],Math.max(8,r.right-260),r.bottom+6); };
  $('#zOut').onclick=()=>S.doc&&ACT.zoomOut.run(); $('#zIn').onclick=()=>S.doc&&ACT.zoomIn.run(); $('#zFit').onclick=()=>S.doc&&fitView();
  $('#zoomval').dataset.menubtn='1'; $('#zoomval').onclick=e=>{ if(!S.doc) return; const r=e.currentTarget.getBoundingClientRect(); const zs=[.25,.5,1,2,4,8]; openMenu([{label:'Einpassen',icon:'fit',run:()=>fitView()},'-',...zs.map(z=>({label:Math.round(z*100)+' %',icon:'none',checked:()=>Math.abs(S.view.z-z)<.001,run:()=>zoomCenter(z)}))],r.left,r.top-8-7*31); };
  $('#zGrid').onclick=()=>ACT.grid.run(); $('#zSnap').onclick=()=>ACT.snap.run(); $('#zGrid').classList.toggle('act',S.grid); $('#zSnap').classList.toggle('act',S.snap);
  $('#fileOpen').onchange=e=>{ handleFiles(e.target.files,{asDoc:true}); e.target.value=''; };
  $('#filePlace').onchange=e=>{ handleFiles(e.target.files); e.target.value=''; };
  $('#fileFont').onchange=async e=>{ for(const f of [...e.target.files]) await installFont(f); e.target.value=''; };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ updThemeIcon(); checkerPat=null; need.view=true; });
  resizeView(); addEventListener('resize',()=>{ resizeView(); const b=$(`.tool[data-tool="${S.tool}"]`); if(b) $('#toolPill').style.transform=`translateY(${b.offsetTop}px)`; });
  if(innerWidth<=900) $('#btnPanel').classList.remove('act'); else $('#btnPanel').classList.add('act');
  setTool(S.tool); renderLayers(); renderInspector(); updUndo();
  try{ document.fonts.addEventListener('loadingdone',()=>{ S.layers.forEach(L=>{ if(L.type==='text'){ L._lay=null; relayout(L); touch(L); } }); }); }catch(e){}
  requestAnimationFrame(loop);
  await IDB.open(); await loadStoredFonts(); await showWelcome();
}
init();
</script>
